# PostgreSQL Client Authentication Configuration File
# ===================================================
# OAManager: every TCP client, including Supabase service roles, must
# authenticate with a SCRAM password. Docker network membership is not an
# authentication boundary.

# TYPE  DATABASE        USER                                    ADDRESS                 METHOD

# Local socket connections
local   all             supabase_admin                                                  scram-sha-256
local   all             all                                                             peer map=supabase_map

# IPv4 TCP, including localhost and Docker bridges
host    all             all                                     0.0.0.0/0               scram-sha-256

# IPv6 TCP, including localhost
host    all             all                                     ::0/0                   scram-sha-256
